<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bohm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="range.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<div class="fig-btns">
  <button class="btn fig-btn" id="fig1-btn">1</button>
  <button class="btn fig-btn active-btn" id="fig2-btn">2</button>
  <button class="btn fig-btn" id="fig3-btn">3</button>
</div>
<div class="b-btn">
  <button class="btn bohm-btn bohm-inactive" id="toggleBohmian">B</button>
</div>

<button class="fire btn" id="fire">
    <svg id="stop" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M0 128C0 92.7 28.7 64 64 64H320c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128z"/></svg>
    <svg id="play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80L0 432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>
</button>


  <div class="display">
    <svg id="staticDiagram"></svg>
    
    <div class="trajectories">
      <canvas id="buffer"></canvas>
      <svg id="trajectory"></svg>
    </div>

    <div class="measurements">
    </div>
  </div>

  <div class="slider-container">
    <div class="variable">
      <h1 class="variableIdentifier">λ</h1>
      <input type="range" name="lambdaSlider" id="lambdaSlider" max="1.5" min=".5" step="0.01">
      <h1 class="variableValue" id="lambdaN">1</h1>
    </div>
  
    <div class="variable">
      <h1 class="variableIdentifier">d</h1>
      <input type="range" name="dSlider" id="dSlider" max="5" min=".5" step="0.01">
      <h1 class="variableValue" id="dN">2.75</h1>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="cameraControls.js"></script>
  <script type="module" src="script2.js"></script>
</body>
</html>
